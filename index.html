<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vein of Winter</title>
    <style>
        body {
            background-color: #050505;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        #canvas-container {
            position: relative;
            aspect-ratio: 4/3;
            height: 100%;
            max-width: 100%;
            @media (max-aspect-ratio: 4/3) {
                width: 100%;
                height: auto;
            }
            background: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 10;
        }

        canvas {
            image-rendering: pixelated;
            width: 100%;
            height: 100%;
            display: block;
            transition: filter 2s ease;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 11;
        }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* 物品栏 - 分两行显示阶段 */
        #inventory {
            position: absolute;
            top: 15px; right: 15px;
            display: flex; flex-direction: column; gap: 5px;
            align-items: flex-end;
        }
        .inv-row { display: flex; gap: 5px; }
        .item {
            width: 20px; height: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #444;
            display: flex; justify-content: center; align-items: center;
            font-size: 12px; opacity: 0.2;
            border-radius: 4px; transition: opacity 0.5s;
        }
        .item.collected { opacity: 1; border-color: #fff; box-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .item.hidden { display: none; } /* 未解锁阶段隐藏 */

        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%; transform: translateX(-50%);
            width: 85%;
            background: rgba(0,0,0,0.9);
            border: 1px solid #fff;
            padding: 12px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        #ending-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 3s;
        }

        #mobile-controls {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }
        #mobile-controls.visible { display: flex; justify-content: space-between; align-items: flex-end; }

        .control-side { width: 160px; height: 100%; pointer-events: auto; position: relative; display: flex; align-items: center; justify-content: center; }
        .dpad-cross { position: relative; width: 140px; height: 140px; margin-bottom: 40px; margin-left: 20px; }
        .action-btn-area { width: 100px; height: 100px; margin-bottom: 60px; margin-right: 40px; }
        .touch-btn { position: absolute; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(2px); touch-action: none; }
        .touch-btn:active { background: rgba(255, 255, 255, 0.3); }
        .d-up { top: 0; left: 34%; width: 32%; height: 34%; border-radius: 6px 6px 0 0; }
        .d-down { bottom: 0; left: 34%; width: 32%; height: 34%; border-radius: 0 0 6px 6px; }
        .d-left { top: 34%; left: 0; width: 34%; height: 32%; border-radius: 6px 0 0 6px; }
        .d-right { top: 34%; right: 0; width: 34%; height: 32%; border-radius: 0 6px 6px 0; }
        .btn-a { width: 80px; height: 80px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4); color: rgba(255,255,255,0.8); font-size: 24px; font-weight: bold; display: flex; justify-content: center; align-items: center; }

        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; padding: 20px; touch-action: manipulation; }
        .lang-select { display: flex; gap: 20px; margin-top: 40px; pointer-events: auto; }
        .lang-btn { background: transparent; border: 1px solid #555; color: #aaa; padding: 15px 30px; font-family: inherit; cursor: pointer; transition: 0.3s; font-size: 16px; touch-action: manipulation; }
        .lang-btn:hover, .lang-btn:active { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); }
        h1 { font-weight: normal; letter-spacing: 4px; margin-bottom: 5px; }
        h2 { font-weight: normal; font-size: 14px; color: #666; letter-spacing: 2px; }
        .room-title { position: absolute; bottom: 15px; left: 15px; color: rgba(255, 255, 255, 0.4); font-size: 12px; text-shadow: 1px 1px 0 #000; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="mobile-controls">
        <div class="control-side"><div class="dpad-cross"><div class="touch-btn d-up" data-key="up"></div><div class="touch-btn d-left" data-key="left"></div><div class="touch-btn d-right" data-key="right"></div><div class="touch-btn d-down" data-key="down"></div></div></div>
        <div style="flex: 1;"></div>
        <div class="control-side"><div class="action-btn-area"><div class="touch-btn btn-a" data-key="action">A</div></div></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="320" height="240"></canvas>
        <div class="scanlines"></div>
        <div class="ui-overlay">
            <div id="inventory">
                <div class="inv-row" id="row-phase1">
                    <div class="item" id="item-drawing">🖍️</div>
                    <div class="item" id="item-wheelchair">🦽</div>
                    <div class="item" id="item-hourglass">⏳</div>
                </div>
                <div class="inv-row" id="row-phase2" style="display:none;">
                    <div class="item" id="item-candy">🍬</div>
                    <div class="item" id="item-tear">💧</div>
                    <div class="item" id="item-watch">⌚</div>
                </div>
            </div>
            <div class="room-title" id="room-name"></div>
            <div id="dialogue-box"></div>
            <div id="ending-overlay"></div>
        </div>
    </div>
</div>

<div id="start-screen">
    <h1>冬之脉</h1>
    <h2>Vein of Winter</h2>
    <div class="lang-select">
        <button class="lang-btn" onclick="startGame('CN')">中文</button>
        <button class="lang-btn" onclick="startGame('EN')">English</button>
        <button class="lang-btn" onclick="startGame('JP')">日本語</button>
    </div>
    <p style="margin-top:30px; font-size: 12px; color: #444;">Headphones Recommended</p>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiDialogue = document.getElementById('dialogue-box');
const roomNameEl = document.getElementById('room-name');
const invRow1 = document.getElementById('row-phase1');
const invRow2 = document.getElementById('row-phase2');

const GAME_WIDTH = 320;
const GAME_HEIGHT = 240;
const SPEED = 2;

// --- 语言数据 ---
const TEXT = {
    CN: {
        title: "冬之脉",
        items: { drawing: "涂鸦本", wheelchair: "轮椅模型", hourglass: "碎裂沙漏", candy: "爸爸的糖果", tear: "妈妈的眼泪", watch: "停止的怀表" },
        rooms: { 
            start_field: "雪原", center: "心脏", west: "记忆回廊", room_w: "糖果屋", 
            east: "白色长廊", room_e: "无菌室", 
            north: "警报", room_n: "警告",

        },

            intro_transform: ["(心跳聲突然響起)", "樹...活過來了？", "不，是我活過來了。", "這裡不是雪原，是我的...心臟。"],

            hourglass_pickup: ["一個碎裂的沙漏。", "沙子已經漏光了。", "時間...就是這樣一點點流逝的。", "我知道我的時間不多了。", {action: 'getHourglass'}],

            candy_pickup: ["爸爸偷偷塞給我的。", "「別告訴媽媽」，他笑著說。", "可是爸爸，你的眼睛為什麼是紅的？", "我吃不下了，但我會把它帶走。", {action: 'getCandy'}],
            tear_pickup: ["地上有個發光的東西。", "那不是玻璃。", "那是媽媽那一刻落在我手背上的眼淚。", "燙燙的，卻又那麼涼。", "對不起，媽媽，別為我哭了。", {action: 'getTear'}],
            watch_pickup: ["一個停止的懷錶。", "指針停在了宣告死亡的那一刻。", "我不想時間停止。", "但我沒有力氣了。", {action: 'getWatch'}],
            
            feather_pickup: ["一根白色的羽毛。", "它很輕，身體好像也變輕了。", "如果我抓住它，是不是就能飛回爸爸媽媽身邊？", "...", "不行，我飛不動了。", "對不起，爸爸媽媽。", {action: 'getFeather'}],
            
            grandma: ["來，孩子。", "不用再打針了，不用再吃苦藥了。", "這裡有好多你喜歡的糖。", "我們走吧。", {action: 'startEnding'}],
            ending_garden: ["「我還放不下爸爸媽媽...」", "老奶奶摸了摸我的頭。", "「傻孩子，愛是不會斷的。」", "「去夢裡告訴他們，你現在很開心。」", {action: 'triggerCabinScene'}],
            ending_cabin: ["那天晚上，爸爸和媽媽做了一個夢。", "夢見他們女兒在一片開滿鮮花的地方奔跑。", "她回過頭，笑得好甜，嘴裡塞滿了糖果。", "「爸爸媽媽，我不痛啦！」", "醒來的時候，窗外有一顆流星劃過。", "他們緊緊抱在一起，哭了。", "但是這一次，心裡是暖的。", "晚安，寶貝。", {action: 'finalStop'}],
            credits: ["冬之脉 - Vein of Winter", "感謝您的遊玩與陪伴", "[ 刷新頁面重來 ]"]
        }
    },
    EN: {
        title: "Vein of Winter", items: { drawing: "Sketchbook", wheelchair: "Wheelchair", hourglass: "Broken Hourglass", candy: "Dad's Candy", tear: "Mom's Tear", watch: "Stopped Watch" },
        dialogue: {
            intro_start: ["Where am I?", "It's so cold...", "That tree looks dead.", "I forgot something..."],
            intro_transform: ["(A heartbeat sounds)", "The tree... is alive?", "No, I am alive.", "This is my heart."],
            intro_heart_phase2: ["It beats heavily.", "My memories are hidden in the rooms.", "I must face them."],
            intro_ready_feather: ["I remember everything.", "The pain, the despair, and the love.", "The line is flat.", "The wall is gone.", {action: 'openGate'}],
            drawing_pickup: ["A sketchbook.", "A drawing of us at the park.", "Before I got sick.", {action: 'getDrawing'}],
            wheelchair_pickup: ["A wheelchair model.", "My legs stopped working.", "Squeak, squeak...", {action: 'getWheelchair'}],
            hourglass_pickup: ["A broken hourglass.", "The sand is gone.", "My time ran out.", {action: 'getHourglass'}],
            candy_pickup: ["Dad's secret candy.", "His eyes were red when he smiled.", "I'll take it with me.", {action: 'getCandy'}],
            tear_pickup: ["Mom's tear.", "It burned my hand.", "Don't cry, Mom.", {action: 'getTear'}],
            watch_pickup: ["A stopped watch.", "Time stopped for me.", "I have no strength left.", {action: 'getWatch'}],
            feather_pickup: ["A white feather.", "So light.", "I can't fly back.", "Sorry, Mom and Dad.", {action: 'getFeather'}],
            grandma: ["Come, child.", "No more pain.", "Let's go.", {action: 'startEnding'}],
            ending_garden: ["'But I miss them...'", "Grandma smiled.", "'Love never breaks.'", {action: 'triggerCabinScene'}],
            ending_cabin: ["They dreamed of her running.", "Smiling, pain-free.", "They woke up crying, but warm.", "Goodnight, love.", {action: 'finalStop'}],
            credits: ["Vein of Winter", "Thank you for playing.", "[ Refresh to Restart ]"]
        }
    },
    JP: {
        title: "冬の脈", items: { drawing: "落書き帳", wheelchair: "車椅子", hourglass: "砂時計", candy: "パパの飴", tear: "ママの涙", watch: "止まった時計" },
        dialogue: {
            intro_start: ["ここはどこ？", "寒い...", "木が枯れてる。", "何か忘れてる..."],
            intro_transform: ["(鼓動が響く)", "木が...生きてる？", "ううん、ここは私の心臓だ。"],
            intro_heart_phase2: ["鼓動が重い。", "見たくないものが隠れてる。", "でも行かなくちゃ。"],
            intro_ready_feather: ["全部思い出した。", "痛みも、絶望も、愛も。", "もう戻れない。", "壁が消えた。", {action: 'openGate'}],
            drawing_pickup: ["落書き帳。", "元気だった頃の私たち。", "アイスが甘かった。", {action: 'getDrawing'}],
            wheelchair_pickup: ["車椅子の模型。", "いつからか、これが私の足だった。", "キー、キー...", {action: 'getWheelchair'}],
            hourglass_pickup: ["壊れた砂時計。", "砂はもうない。", "時間が足りなかった。", {action: 'getHourglass'}],
            candy_pickup: ["パパの飴。", "パパ、どうして目が赤いの？", "持っていくね。", {action: 'getCandy'}],
            tear_pickup: ["ママの涙。", "熱くて、冷たい。", "泣かないで、ママ。", {action: 'getTear'}],
            watch_pickup: ["止まった時計。", "時が止まった。", "もう力が入らない。", {action: 'getWatch'}],
            feather_pickup: ["白い羽。", "軽い。", "もう飛べないよ。", "ごめんね。", {action: 'getFeather'}],
            grandma: ["おいで。", "もう痛くないよ。", "行こう。", {action: 'startEnding'}],
            ending_garden: ["「でもパパとママが...」", "お婆ちゃんは笑った。", "「愛はずっと繋がってる。」", {action: 'triggerCabinScene'}],
            ending_cabin: ["その夜、二人は夢を見た。", "花畑を走る娘を。", "「もう痛くないよ！」", "二人は泣いた。でも心は温かかった。", "おやすみ。", {action: 'finalStop'}],
            credits: ["冬の脈 - Vein of Winter", "遊んでくれてありがとう", "[ 更新して再開 ]"]
        }
    }
};

// --- Game State ---
const gameState = {
    lang: 'CN',
    room: 'center', 
    player: { x: 160, y: 180, w: 8, h: 14, facing: 'down', moving: false, visible: true },
    target: { x: 160, y: 180 },
    dialogue: { active: false, queue: [], callback: null },
    snow: [],
    footprints: [],
    input: { up: false, down: false, left: false, right: false },
    flags: { 
        // Phase 1 Items
        hasDrawing: false, hasWheelchair: false, hasHourglass: false,
        // Phase 2 Items
        hasCandy: false, hasTear: false, hasWatch: false,
        // States
        transformed: false, gateOpen: false, endingPhase: 0 
    },
    anim: { t: 0, dragon: [], bird: {x:50, y:50, tx:50, ty:50} },
    transition: { active: false, timer: 0, nextRoom: null, nextX: 0, nextY: 0 }
};

// --- Audio System ---
const AudioSys = {
    ctx: null, masterGain: null, isPlaying: false,
    notes: [220, 261.63, 329.63, 196.00, 246.94, 293.66], 
    init: function() {
        if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AC();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.4; 
            this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.playTone(440, 'sine', 0.1, 0.001); // unlock
        if (!this.isPlaying) { this.isPlaying = true; this.scheduleNextNote(); }
    },
    playTone: function(freq, type='sine', duration=0.5, vol=0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    },
    playSFX: function(name) {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        switch(name) {
            case 'step': this.playNoise(0.05, 0.03); break;
            case 'text': this.playTone(800 + Math.random()*200, 'square', 0.05, 0.02); break;
            case 'pickup': this.playTone(1200, 'sine', 0.1, 0.1); setTimeout(() => this.playTone(1800, 'sine', 0.3, 0.1), 100); break;
            case 'heartbeat': this.playTone(60, 'triangle', 0.2, 0.3); break;
            case 'open': this.playNoise(1.5, 0.1); break;
            case 'warmth': this.playTone(261.63, 'sine', 3, 0.05); this.playTone(329.63, 'sine', 3, 0.05); this.playTone(392.00, 'sine', 3, 0.05); break;
            case 'thump': this.playNoise(0.5, 0.5); break;
        }
    },
    playNoise: function(duration, vol) {
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * duration, this.ctx.sampleRate);
        const data = buf.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource(); noise.buffer = buf;
        const gain = this.ctx.createGain(); gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        noise.connect(gain); gain.connect(this.masterGain); noise.start();
    },
    scheduleNextNote: function() {
        if (!this.isPlaying) return;
        if (gameState.flags.endingPhase > 0) return;
        const note = this.notes[Math.floor(Math.random() * this.notes.length)];
        const octave = Math.random() > 0.7 ? 0.5 : 1;
        this.playTone(note * octave, 'sine', 4.0, 0.03); 
        setTimeout(() => this.scheduleNextNote(), 2000 + Math.random() * 2000);
    }
};

function t(key, subkey) {
    if (subkey) return TEXT[gameState.lang] ? TEXT[gameState.lang][key][subkey] : "";
    return TEXT[gameState.lang][key];
}

// --- Rooms ---
const rooms = {
    'center': {
        nameKey: 'center', bg: '#050505',
        entities: [
            { id: 'crowd_bg', type: 'stickmen', y: 140, alpha: 0.5 },
            { id: 'tree_main', type: 'tree', x: 160, y: 140, w: 20, h: 20, color: '#aa0000', variant: 'tree', // Initial: Tree
              logic: (s) => {
                  if (s.flags.gateOpen) return t('dialogue', 'intro_gate_open');
                  if (!s.flags.transformed) return t('dialogue', 'intro_start');
                  if (s.flags.hasCandy && s.flags.hasTear && s.flags.hasWatch) return t('dialogue', 'intro_ready_feather');
                  AudioSys.playSFX('heartbeat'); return t('dialogue', 'intro_heart_phase2');
              }
            },
            { id: 'feather_center', type: 'item_pickup', x: 160, y: 170, w: 15, h: 15, color: '#fff',
              condition: (s) => s.flags.hasCandy && s.flags.hasTear && s.flags.hasWatch && !s.flags.gateOpen,
              logic: () => t('dialogue', 'feather_pickup')
            },
            { id: 'moon', type: 'moon', x: 160, y: 80 },
            { id: 'path_w', type: 'warp', x: 0, y: 100, w: 10, h: 40, target: 'corridor_w', targetX: 280, targetY: 120 },
            { id: 'path_e', type: 'warp', x: 310, y: 100, w: 10, h: 40, target: 'corridor_e', targetX: 40, targetY: 120 },
            { id: 'path_n', type: 'warp', x: 130, y: 0, w: 60, h: 10, target: 'corridor_n', targetX: 160, targetY: 220 },
            { id: 'path_s', type: 'warp', x: 130, y: 230, w: 60, h: 10, target: 'south', targetX: 160, targetY: 20, condition: (s) => s.flags.gateOpen },
            { id: 'crowd_fg', type: 'stickmen', y: 220, alpha: 0.8 },

};

// --- Initialization ---
function startGame(lang) {
    gameState.lang = lang;
    AudioSys.init();
    document.getElementById('start-screen').style.display = 'none';
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.getElementById('mobile-controls').classList.add('visible');
        document.getElementById('dialogue-box').style.bottom = '40%';
    }
    // Set inventory titles
    invItems.drawing.title = t('items', 'drawing');
    invItems.wheelchair.title = t('items', 'wheelchair');
    invItems.hourglass.title = t('items', 'hourglass');
    invItems.candy.title = t('items', 'candy');
    invItems.tear.title = t('items', 'tear');
    invItems.watch.title = t('items', 'watch');
    
    updateRoomName();
}

function updateRoomName() {
    const room = rooms[gameState.room];
    if(room.nameKey === 'garden') document.getElementById('room-name').style.color = '#fff';
    let name = t('rooms', room.nameKey || 'center');
    if (gameState.room === 'center' && !gameState.flags.transformed) {
        name = t('rooms', 'start_field'); 
    }
    document.getElementById('room-name').innerText = name;
}

// --- Control Binding ---
function bindControls() {
    const btns = document.querySelectorAll('.touch-btn');
    btns.forEach(btn => {
        const key = btn.dataset.key; if(!key) return;
        const down = (e) => {
            if(e.cancelable) e.preventDefault();
            btn.style.background = 'rgba(255,255,255,0.4)';
            AudioSys.init(); 
            if(key === 'action') {
                if(gameState.dialogue.active) nextDialogueLine();
                else checkInteraction();
            } else {
                gameState.input[key] = true;
            }
        };
        const up = (e) => {
            if(e.cancelable) e.preventDefault();
            btn.style.background = '';
            if(key !== 'action') gameState.input[key] = false;
        };
        btn.addEventListener('touchstart', down, {passive:false});
        btn.addEventListener('touchend', up, {passive:false});
        btn.addEventListener('mousedown', down);
        btn.addEventListener('mouseup', up);
    });
}

function init() {
    for(let i=0; i<50; i++) gameState.snow.push({x: Math.random() * GAME_WIDTH, y: Math.random() * GAME_HEIGHT, speed: Math.random() * 1 + 0.5});
    for(let i=0; i<20; i++) gameState.anim.dragon.push({x: -50 - i*15, y: 50});
    bindControls();
    window.addEventListener('keydown', (e) => {
        if(gameState.dialogue.active && (e.code==='Space'||e.code==='Enter')) { nextDialogueLine(); return; }
        switch(e.key.toLowerCase()){
            case 'w': case 'arrowup': gameState.input.up=true; break;
            case 's': case 'arrowdown': gameState.input.down=true; break;
            case 'a': case 'arrowleft': gameState.input.left=true; break;
            case 'd': case 'arrowright': gameState.input.right=true; break;
            case ' ': case 'enter': checkInteraction(); break;
        }
    });
    window.addEventListener('keyup', (e) => {
        switch(e.key.toLowerCase()){
            case 'w': case 'arrowup': gameState.input.up=false; break;
            case 's': case 'arrowdown': gameState.input.down=false; break;
            case 'a': case 'arrowleft': gameState.input.left=false; break;
            case 'd': case 'arrowright': gameState.input.right=false; break;
        }
    });
    canvas.addEventListener('pointerdown', (e) => {
        if(gameState.dialogue.active) { nextDialogueLine(); return; }
        const isMobile = document.getElementById('mobile-controls').classList.contains('visible');
        if(isMobile) return; 
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = GAME_WIDTH / rect.width;
        const scaleY = GAME_HEIGHT / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;
        
        let clicked = false;
        if(gameState.flags.endingPhase === 0) {
            rooms[gameState.room].entities.forEach(ent => {
                if(ent.condition && !ent.condition(gameState)) return;
                let ex=ent.x, ey=ent.y, ew=ent.w||20, eh=ent.h||20;
                if(ent.type==='tree') { ex=ent.x-ew/2; ey=ent.y-eh; }
                if(ent.type==='npc_grandma' || ent.type==='item_pickup') { ex=ent.x-10; ey=ent.y-10; }
                if(checkRectCollide(clickX, clickY, 1, 1, ex-20, ey-20, ew+40, eh+40)) {
                    interact(ent); clicked=true;
                }
            });
        }
        if(!clicked && gameState.flags.endingPhase === 0) {
            gameState.target.x = clickX - gameState.player.w/2;
            gameState.target.y = clickY - gameState.player.h/2;
            gameState.player.moving = true;
        }
    });
    requestAnimationFrame(gameLoop);
}

// --- Logic ---
function startRoomTransition(targetId, targetX, targetY) {
    gameState.transition = { active: true, timer: 0, nextRoom: targetId, nextX: targetX, nextY: targetY };
    gameState.player.moving = false;
}

function updateHUD() {
    // BPM/SPO2 Logic
    let stress = 0;
    if (gameState.flags.hasDrawing) stress++; if (gameState.flags.hasWheelchair) stress++; if (gameState.flags.hasHourglass) stress++;
    if (gameState.flags.hasCandy) stress++; if (gameState.flags.hasTear) stress++; if (gameState.flags.hasWatch) stress++;
    
    let bpm = 75 + (stress * 10) + Math.floor(Math.sin(gameState.anim.t * 2) * 5);
    let spo2 = 98 - (stress * 3);
    
    if (gameState.flags.endingPhase > 0) {
        document.getElementById('medical-hud').style.display = 'none';
    } else {
        document.getElementById('hud-bpm').innerText = bpm;
        document.getElementById('hud-spo2').innerText = spo2 + "%";
        if (spo2 < 90) document.getElementById('hud-spo2').classList.add('warning');
        if (bpm > 120) document.getElementById('hud-bpm').classList.add('warning');
    }
}

function changeRoomLogic(id) {
    gameState.room = id;
    gameState.footprints = []; 
    updateRoomName();
    
    // Check Transformation: Needs Drawing+Wheelchair+Hourglass
    if (id === 'center' && !gameState.flags.transformed 
        && gameState.flags.hasDrawing && gameState.flags.hasWheelchair && gameState.flags.hasHourglass) {
        triggerTransformation();
    }

    if(id === 'south') {
        if(gameState.flags.endingPhase === 1) rooms[id].nameKey = 'garden';
        else rooms[id].nameKey = 'south';
        updateRoomName();
    }
}

function triggerTransformation() {
    gameState.flags.transformed = true;
    invRow2.style.display = 'flex'; // Show Phase 2 items slot
    rooms['center'].entities.forEach(e => {
        if(e.id === 'tree_main') e.variant = 'vein'; 
    });
    AudioSys.playSFX('thump');
    setTimeout(() => {
        startDialogue(t('dialogue', 'intro_transform'));
        updateRoomName(); 
    }, 500);
}

function handleAction(act) {
    // Phase 1
    if(act === 'getDrawing') { gameState.flags.hasDrawing = true; invItems.drawing.classList.add('collected'); AudioSys.playSFX('pickup'); }
    else if(act === 'getWheelchair') { gameState.flags.hasWheelchair = true; invItems.wheelchair.classList.add('collected'); AudioSys.playSFX('pickup'); }
    else if(act === 'getHourglass') { gameState.flags.hasHourglass = true; invItems.hourglass.classList.add('collected'); AudioSys.playSFX('pickup'); }
    // Phase 2
    else if(act === 'getCandy') { gameState.flags.hasCandy = true; invItems.candy.classList.add('collected'); AudioSys.playSFX('pickup'); }
    else if(act === 'getTear') { gameState.flags.hasTear = true; invItems.tear.classList.add('collected'); AudioSys.playSFX('pickup'); }
    else if(act === 'getWatch') { gameState.flags.hasWatch = true; invItems.watch.classList.add('collected'); AudioSys.playSFX('pickup'); }
    // Ending
    else if(act === 'getFeather') { gameState.flags.gateOpen = true; AudioSys.playSFX('open'); startDialogue(t('dialogue', 'intro_ready_feather')); }
    else if(act === 'openGate') { /* Dialogue finished gate logic already set */ }
    else if(act === 'startEnding') {
        gameState.flags.endingPhase = 1; AudioSys.playSFX('warmth');
        startRoomTransition('south', 140, 110);
        setTimeout(() => startDialogue(t('dialogue', 'ending_garden')), 2500);
    }
    else if(act === 'triggerCabinScene') {
        document.getElementById('ending-overlay').style.opacity = 1;
        setTimeout(() => {
            gameState.flags.endingPhase = 2;
            document.getElementById('ending-overlay').style.opacity = 0;
            document.getElementById('room-name').innerText = t('rooms', 'cabin');
            setTimeout(() => startDialogue(t('dialogue', 'ending_cabin')), 1000);
        }, 2000);
    }
    else if(act === 'finalStop') {
        gameState.flags.endingPhase = 3;
        document.getElementById('ending-overlay').style.opacity = 1;
        setTimeout(() => { uiDialogue.style.display = 'none'; }, 1000);
    }
}

function update() {
    if(gameState.dialogue.active || gameState.flags.endingPhase >= 2) return;

    if (gameState.transition.active) {
        gameState.transition.timer += 0.05;
        if (gameState.transition.timer >= 1.0 && gameState.transition.nextRoom) {
            changeRoomLogic(gameState.transition.nextRoom);
            gameState.player.x = gameState.transition.nextX;
            gameState.player.y = gameState.transition.nextY;
            gameState.target.x = gameState.transition.nextX;
            gameState.target.y = gameState.transition.nextY;
            gameState.transition.nextRoom = null;
        }
        if (gameState.transition.timer >= 2.0) gameState.transition.active = false;
        return;
    }
    
    updateHUD();

    const p = gameState.player;
    let dx = 0, dy = 0;
    if(gameState.input.up) dy = -SPEED;
    if(gameState.input.down) dy = SPEED;
    if(gameState.input.left) dx = -SPEED;
    if(gameState.input.right) dx = SPEED;
    
    if(dx===0 && dy===0 && p.moving) {
        const dist = Math.hypot(gameState.target.x - p.x, gameState.target.y - p.y);
        if(dist < SPEED) { p.x = gameState.target.x; p.y = gameState.target.y; p.moving = false; }
        else {
            const angle = Math.atan2(gameState.target.y - p.y, gameState.target.x - p.x);
            dx = Math.cos(angle) * SPEED; dy = Math.sin(angle) * SPEED;
        }
    } else if(dx!==0 || dy!==0) p.moving = false;

    if (dx !== 0 || dy !== 0) {
        if (gameState.room !== 'south' && Math.random() > 0.8) {
            gameState.footprints.push({x: p.x + 2, y: p.y + p.h, age: 1.0});
            AudioSys.playSFX('step');
        }
    }
    for (let i = gameState.footprints.length - 1; i >= 0; i--) {
        gameState.footprints[i].age -= 0.005;
        if (gameState.footprints[i].age <= 0) gameState.footprints.splice(i, 1);
    }

    let nextX = p.x + dx, nextY = p.y + dy, collided = false;
    if(nextX < 0) nextX = 0; if(nextX > GAME_WIDTH - p.w) nextX = GAME_WIDTH - p.w;
    if(nextY < 0) nextY = 0; if(nextY > GAME_HEIGHT - p.h) nextY = GAME_HEIGHT - p.h;

    if(gameState.room !== 'south') {
        rooms[gameState.room].entities.forEach(ent => {
            if(ent.condition && !ent.condition(gameState)) return;
            if(['stickmen','particles'].includes(ent.type)) return;
            let ex=ent.x, ey=ent.y, ew=ent.w||20, eh=ent.h||20;
            if(ent.type==='tree') { ex=ent.x-ew/2; ey=ent.y-eh; }
            if(ent.type==='npc_grandma' || ent.type==='item_pickup') { ex=ent.x-10; ey=ent.y-10; }
            
            if(checkRectCollide(nextX, nextY, p.w, p.h, ex, ey, ew, eh)) {
                if(ent.type==='warp') { startRoomTransition(ent.target, ent.targetX, ent.targetY); return; }
                else if(ent.type==='item_pickup') { interact(ent); collided=true; }
                else collided=true;
            }
        });
    } else {
        rooms[gameState.room].entities.forEach(ent => {
             if(ent.type==='warp' && gameState.flags.endingPhase===0 && checkRectCollide(nextX, nextY, p.w, p.h, ent.x, ent.y, ent.w, ent.h)) {
                 startRoomTransition(ent.target, ent.targetX, ent.targetY); return;
             }
             if(ent.type==='npc_grandma' && checkRectCollide(nextX, nextY, p.w, p.h, ent.x-10, ent.y-10, 20, 20)) collided=true;
        });
    }

    if(!collided) { p.x = nextX; p.y = nextY; }
    if(dx<0) p.facing='left'; if(dx>0) p.facing='right';
    
    gameState.anim.t += 0.05;
}

function checkRectCollide(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
}

function checkInteraction() {
    const p = gameState.player;
    const reach = 25;
    let checkX = p.x, checkY = p.y;
    if(p.facing==='left') checkX -= reach; if(p.facing==='right') checkX += reach;
    if(p.facing==='up') checkY -= reach; if(p.facing==='down') checkY += reach;

    rooms[gameState.room].entities.forEach(ent => {
        if(ent.condition && !ent.condition(gameState)) return;
        let ex=ent.x, ey=ent.y, ew=ent.w||20, eh=ent.h||20;
        if(ent.type==='tree') { ex=ent.x-ew/2; ey=ent.y-eh; }
        if(ent.type==='npc_grandma' || ent.type==='item_pickup') { ex=ent.x-10; ey=ent.y-10; }
        if(checkRectCollide(checkX, checkY, 1, 1, ex-10, ey-10, ew+20, eh+20)) interact(ent);
    });
}

function interact(ent) {
    let content = ent.logic ? ent.logic(gameState) : ent.interaction;
    if(content) startDialogue(content);
}

function startDialogue(lines) {
    gameState.dialogue.active = true;
    gameState.dialogue.queue = [];
    gameState.dialogue.callback = null;
    uiDialogue.style.display = 'block';
    
    if(Array.isArray(lines)) {
        lines.forEach(l => {
            if(typeof l === 'string') gameState.dialogue.queue.push(l);
            else if(l.action) gameState.dialogue.callback = l.action;
        });
    } else gameState.dialogue.queue.push(lines);
    
    nextDialogueLine();
}

function nextDialogueLine() {
    if(gameState.dialogue.queue.length === 0) {
        gameState.dialogue.active = false;
        uiDialogue.style.display = 'none';
        if(gameState.dialogue.callback) handleAction(gameState.dialogue.callback);
        return;
    }
    const txt = gameState.dialogue.queue.shift();
    uiDialogue.innerText = "";
    let i = 0;
    const timer = setInterval(() => {
        uiDialogue.innerText += txt.charAt(i);
        if(i%2===0) AudioSys.playSFX('text');
        i++;
        if(i >= txt.length) clearInterval(timer);
    }, 30);
}

function draw() {
    if(gameState.flags.endingPhase === 1) { drawGarden(); return; }
    if(gameState.flags.endingPhase === 2) { drawCabin(); return; }
    if(gameState.flags.endingPhase === 3) { drawCredits(); return; }

    const room = rooms[gameState.room];
    ctx.fillStyle = room.bg;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    // Footprints
    ctx.fillStyle = 'rgba(200,200,200,0.3)';
    gameState.footprints.forEach(fp => {
        ctx.globalAlpha = fp.age * 0.3; ctx.fillRect(fp.x, fp.y, 3, 2);
    }); ctx.globalAlpha = 1.0;

    room.entities.forEach(e => {
        if(e.condition && !e.condition(gameState)) return;
        if(e.type === 'stickmen') {
            if(e.id === 'crowd_bg') drawStickmen(e.y, e.alpha);
        } else if(e.type === 'tree') drawTree(e.x, e.y, e.color, e.variant);
        else if(e.type === 'moon') drawMoon(e.x, e.y);
        else if(e.type === 'bird') drawBird();
        else if(e.type === 'dragon') drawDragon();
        else if(e.type === 'item_pickup') drawItem(e.x, e.y, e.color);
        else if(e.type === 'npc_grandma') drawGrandma(e.x, e.y);
        else if(e.type === 'warp') { ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(e.x, e.y, e.w, e.h); }
        else if(e.type === 'particles') drawParticles(e.color);
    });

    drawPlayer(gameState.player.x, gameState.player.y);

    room.entities.forEach(e => {
        if(e.condition && !e.condition(gameState)) return;
        if(e.type === 'stickmen' && e.id === 'crowd_fg') drawStickmen(e.y, e.alpha);
    });

    ctx.fillStyle = '#fff';
    gameState.snow.forEach(s => {
        s.y += s.speed; if(s.y > GAME_HEIGHT) s.y = 0;
        ctx.fillRect(s.x, s.y, 1, 1);
    });

    drawVignette();

    if (gameState.transition.active) {
        let alpha = 0;
        if (gameState.transition.timer < 1.0) alpha = gameState.transition.timer; 
        else alpha = 2.0 - gameState.transition.timer; 
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.fillRect(0,0,GAME_WIDTH, GAME_HEIGHT);
    }
}

// --- Draw Helpers ---
function drawVignette() {
    const pulse = Math.sin(gameState.anim.t * 2) * 0.1 + 0.1; 
    let intensity = 0.4;
    // Stronger heartbeat effect after transformation
    if (gameState.room === 'center' && gameState.flags.transformed) intensity = 0.6 + pulse;
    
    const grad = ctx.createRadialGradient(GAME_WIDTH/2, GAME_HEIGHT/2, 80, GAME_WIDTH/2, GAME_HEIGHT/2, 200);
    grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, `rgba(0,0,0,${intensity})`);
    ctx.fillStyle = grad; ctx.fillRect(0,0,GAME_WIDTH, GAME_HEIGHT);
}

function circle(x, y, r, c) { ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); }
function drawPlayer(x, y) {
    const p = gameState.player; if(!p.visible) return;
    const breath = Math.floor(Math.sin(gameState.anim.t * 3) * 1);
    ctx.fillStyle='#fff'; ctx.fillRect(x,y + breath,p.w,p.h - breath);
    ctx.fillStyle='#d00'; ctx.fillRect(x-2,y+4+breath,p.w+4,3);
    if(p.facing==='left') ctx.fillRect(x-2,y+4+breath,2,6); else ctx.fillRect(x+p.w,y+4+breath,2,6);
    ctx.fillStyle='#000';
    if(p.facing==='left') ctx.fillRect(x+2,y+3+breath,1,1); else ctx.fillRect(x+5,y+3+breath,1,1);
}
function drawTree(x,y,c,v) {
    ctx.save(); ctx.fillStyle=c;
    if(v==='tree') { // Normal dry tree
        ctx.fillRect(x-6,y-100,12,100); ctx.strokeStyle='#555'; ctx.lineWidth=2; ctx.beginPath();
        ctx.moveTo(x-6,y-60); ctx.lineTo(x-40,y-120); ctx.moveTo(x+6,y-50); ctx.lineTo(x+50,y-110);
        ctx.moveTo(x,y-80); ctx.lineTo(x-10,y-130); ctx.stroke();
    } else if(v==='vein') { // Pulsing heart tree
        const pulse = Math.sin(gameState.anim.t * 2) * 2;
        ctx.fillRect(x-8 - pulse/2,y-100,16 + pulse,100); ctx.strokeStyle=c; ctx.lineWidth=2; ctx.beginPath();
        ctx.moveTo(x-8,y-60); ctx.bezierCurveTo(x-30-pulse,y-80,x-60,y-120,x-80,y-160);
        ctx.moveTo(x+8,y-50); ctx.bezierCurveTo(x+30+pulse,y-80,x+80,y-100,x+100,y-150);
        ctx.moveTo(x,y-80); ctx.bezierCurveTo(x-10,y-120,x+10,y-140,x,y-180); ctx.stroke();
        circle(x-20,y-110,4,'#fff'); circle(x+30,y-130,3,'#fff');
        ctx.fillStyle=c; ctx.fillRect(x-12,y-10,24,10);
    } else if(v==='melt') {
        ctx.beginPath(); ctx.moveTo(x-10,y+100); ctx.bezierCurveTo(x-20,y+80,x-5,y+50,x,y);
        ctx.bezierCurveTo(x+5,y+50,x+20,y+80,x+10,y+100); ctx.fill(); circle(x,y-20,30,c);
    } else if(v==='drip') {
        ctx.fillRect(x-2,y,4,100); ctx.fillRect(x-20,y+20,40,2); ctx.strokeStyle=c;
        ctx.strokeRect(x-18,y+22,10,15); ctx.strokeRect(x+8,y+22,10,15);
    } else if(v==='spike') {
        ctx.beginPath(); ctx.moveTo(x,y+100); ctx.lineTo(x-10,y+80); ctx.lineTo(x+15,y+60);
        ctx.lineTo(x-5,y+40); ctx.lineTo(x,y); ctx.lineTo(x+5,y+40); ctx.lineTo(x-15,y+60);
        ctx.lineTo(x+10,y+80); ctx.fill();
    }
    ctx.restore();
}
function drawMoon(x,y) { circle(x,y,60,'#0044ff'); }
function drawStickmen(yb, a) {
    ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle='#0044ff'; ctx.lineWidth=2;
    for(let i=0;i<10;i++){
        let x=i*40-10, y=yb+Math.sin(Date.now()/500+i)*2;
        ctx.beginPath(); ctx.arc(x,y-20,8,0,6.28); ctx.moveTo(x,y-12); ctx.lineTo(x,y+10);
        ctx.moveTo(x,y-5); ctx.lineTo(x-20,y); ctx.moveTo(x,y-5); ctx.lineTo(x+20,y);
        ctx.moveTo(x,y+10); ctx.lineTo(x-8,y+25); ctx.moveTo(x,y+10); ctx.lineTo(x+8,y+25); ctx.stroke();
    } ctx.restore();
}
function drawItem(x,y,c) {
    ctx.save(); const t=gameState.anim.t; ctx.globalAlpha=0.5+Math.sin(t*5)*0.3; ctx.fillStyle=c;
    ctx.beginPath();
    if(c==='#aaf'){ ctx.moveTo(x,y-8); ctx.bezierCurveTo(x-4,y,x-4,y+6,x,y+6); ctx.bezierCurveTo(x+4,y+6,x+4,y,x,y-8); }
    else if(c==='#da0'){ ctx.fillRect(x-4,y-6,8,12); } // Clockish
    else if(c==='#f0f'){ ctx.fillRect(x-6,y-6,12,12); } // Bookish
    else if(c==='#aaa'){ ctx.fillRect(x-6,y-6,12,12); } // Wheelchair-ish
    else { ctx.moveTo(x,y-8); ctx.lineTo(x+6,y+4); ctx.lineTo(x-6,y+4); }
    ctx.fill(); ctx.fillStyle='#fff'; ctx.fillRect(x-1,y-1,2,2); ctx.restore();
}
function drawProp(x,y,id,c) {
    ctx.fillStyle = c;
    if (id === 'drawing') { ctx.fillRect(x,y,20,14); ctx.fillStyle='#fff'; ctx.fillRect(x+2,y+2,16,10); }
    if (id === 'wheelchair') { ctx.strokeStyle=c; ctx.beginPath(); ctx.arc(x+5, y+10, 8, 0, 6.28); ctx.stroke(); ctx.fillRect(x+5,y,10,15); }
    if (id === 'hourglass') { ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+10,y); ctx.lineTo(x+5,y+10); ctx.lineTo(x+10,y+20); ctx.lineTo(x,y+20); ctx.lineTo(x+5,y+10); ctx.fill(); }
}
function drawDragon() {
    const t=gameState.anim.t; let hx=(Date.now()/20)%(GAME_WIDTH+400)-200;
    for(let i=0;i<20;i++){
        let sx=hx-i*15, sy=60+Math.sin(t-i*0.2)*30;
        if(sx>-50 && sx<GAME_WIDTH+50) circle(sx,sy,6,i%2?'#ff1493':'#ff69b4');
    } circle(hx,60+Math.sin(t)*30,10,'#fff');
}
function drawBird() {
    const b=gameState.anim.bird; ctx.fillStyle='#d00';
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-10,b.y-5); ctx.lineTo(b.x+10,b.y-5); ctx.lineTo(b.x,b.y+15); ctx.fill();
}
function drawGrandma(x,y) {
    ctx.fillStyle='#888'; ctx.fillRect(x-5,y,10,16); circle(x,y-2,6,'#f0d0b0'); ctx.fillStyle='#eee'; ctx.fillRect(x-6,y-8,12,4);
}
function drawParticles(c) {
    ctx.fillStyle=c; for(let i=0;i<10;i++) ctx.fillRect((Math.sin(gameState.anim.t+i)*160)+160,(Math.cos(gameState.anim.t*0.5+i)*120)+120,2,2);
}

function drawGarden() {
    ctx.fillStyle='#87ceeb'; ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
    ctx.fillStyle='#90ee90'; ctx.fillRect(0,120,GAME_WIDTH,120);
    for(let i=0;i<30;i++) circle((i*239)%GAME_WIDTH, 130+(i*113)%100, 2, ['#ff69b4','#ffff00','#fff'][i%3]);
    circle(280,40,20,'#ffd700'); drawGrandma(160,100); drawPlayer(140,110);
    ctx.fillStyle='#fff'; let by=50+Math.sin(gameState.anim.t)*10; 
    ctx.beginPath(); ctx.moveTo(100,by); ctx.lineTo(90,by-5); ctx.lineTo(110,by-5); ctx.fill();
}
function drawCabin() {
    ctx.fillStyle='#5c4033'; ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
    ctx.fillStyle='#111'; ctx.fillRect(100,40,120,80);
    ctx.strokeStyle='#fff'; if(Math.random()>0.95) { ctx.beginPath(); ctx.moveTo(120,60); ctx.lineTo(180,80); ctx.stroke(); }
    ctx.fillStyle='#4682b4'; ctx.fillRect(150,140,12,40); circle(156,135,6,'#deb887');
    ctx.fillStyle='#db7093'; ctx.fillRect(162,145,12,35); circle(168,140,6,'#deb887');
    ctx.fillStyle='#4682b4'; ctx.fillRect(162,150,4,10); ctx.fillStyle='#db7093'; ctx.fillRect(150,155,4,10);
}
function drawCredits() {
    document.getElementById('ending-overlay').style.opacity=0;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
    ctx.fillStyle='#fff'; ctx.font='16px Courier New'; ctx.textAlign='center';
    ctx.fillText(t('dialogue','credits')[0], GAME_WIDTH/2, 80);
    ctx.fillStyle='#888'; ctx.font='12px Courier New'; ctx.fillText("Vein of Winter", GAME_WIDTH/2, 100);
    ctx.fillStyle='#ccc'; ctx.fillText(t('dialogue','credits')[1], GAME_WIDTH/2, 140);
    if(gameState.anim.t%50>25) ctx.fillText(t('dialogue','credits')[2], GAME_WIDTH/2, 200);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

init();
</script>
</body>
</html>
